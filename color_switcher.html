<!DOCTYPE html>
<html lang="en">
<head>
    <title>Color scheme changer</title>
    <link rel="stylesheet" href="colorchanger.css">
    <style>
        .button{
            height: 50px;
            width: 50px;
            background-color: #fff;
            padding: 10px 20px;
            color: #212121;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div>
        <button style="height: 20px; width: 80px;"> home </button>
        <button style="height: 20px; width: 150px;"> youtube channel</button>
    </div>
    <h1> color switcher scheme</h1>
    <span class="button" id="grey"></span>
    <span class="button" id="green"></span>
    <span class="button" id="blue"></span>
    <span class="button" id="pink"></span>
</body>
<script src="chaiaurcode.js"></script>
</html>
